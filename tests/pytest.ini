[pytest]

# ============================================================
# ASYNC SUPPORT
# ============================================================
asyncio_mode = auto
# Enables testing of async FastAPI endpoints

# ============================================================
# WHERE TO FIND TESTS
# ============================================================
testpaths = tests
# Only scan the 'tests/' folder

python_files = test_*.py
# Test files must start with 'test_'

python_classes = Test*
# Test classes must start with 'Test'

python_functions = test_*
# Test functions must start with 'test_'

# ============================================================
# COMMAND LINE DEFAULTS
# ============================================================
addopts =
    -v                          # Show test names
    --strict-markers            # Prevent marker typos
    --tb=short                  # Shorter error messages
    --cov=app                   # Measure code coverage
    --cov-report=term-missing   # Show uncovered lines
    --cov-report=html           # Generate HTML report

# ============================================================
# TEST CATEGORIES (use with -m flag)
# ============================================================
markers =
    unit: Fast, isolated tests (no DB)
    integration: Tests that need a database
    e2e: Tests that call real API endpoints
    slow: Long-running tests
